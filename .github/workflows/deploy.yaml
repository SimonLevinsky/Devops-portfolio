name: Deploy App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "Stopping containers"
            docker stop $(docker ps -q) || true

            echo "Removing containers"
            docker rm $(docker ps -aq) || true

            echo "Removing old image"
            docker rmi devops-app || true

            echo "Updating repo"
            if [ ! -d "$HOME/Devops-portfolio" ]; then
              git clone https://github.com/SimonLevinsky/Devops-portfolio.git $HOME/Devops-portfolio
            fi

            cd $HOME/Devops-portfolio
            git pull

            cd app

            echo "Building image"
            docker build -t devops-app .

            echo "Running container"
            docker run -d -p 80:5000 --name devops-app devops-app
```
